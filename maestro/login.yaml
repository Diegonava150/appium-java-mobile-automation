# Login smoke — the other thing that, if broken, makes the deep suite pointless to run.
#
# See smoke.yaml for why these use `text:` rather than `id:`.

appId: com.saucelabs.mydemoapp.rn
name: Login smoke
---
- launchApp:
    clearState: true

- assertVisible:
    text: "products screen"

# Login lives behind the drawer.
- tapOn:
    text: "open menu"
- tapOn:
    text: "menu item log in"
- assertVisible:
    text: "login screen"

- tapOn:
    text: "Username input field"
- inputText: "bob@example.com"
- hideKeyboard
- tapOn:
    text: "Password input field"
- inputText: "10203040"
- hideKeyboard
- tapOn:
    text: "Login button"

- assertVisible:
    text: "products screen"
