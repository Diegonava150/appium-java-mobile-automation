# Login smoke — the other thing that, if broken, makes the deep suite pointless to run.
#
# See smoke.yaml for why these use `text:` rather than `id:`.

appId: com.saucelabs.mydemoapp.rn
name: Login smoke
---
- launchApp:
    clearState: true

- assertVisible:
    text: "products screen"

# Login lives behind the drawer.
- tapOn:
    text: "open menu"
- tapOn:
    text: "menu item log in"
- assertVisible:
    text: "login screen"

- tapOn:
    text: "Username input field"
- inputText: "bob@example.com"
- hideKeyboard
- tapOn:
    text: "Password input field"
- inputText: "10203040"
- hideKeyboard
- tapOn:
    text: "Login button"

# Android may offer to save the password through Google Password Manager. It is a system
# dialog, so it sits above the catalog and makes the assertion below fail. Dismiss it only
# if it is actually there — `when: visible` makes the whole block a no-op otherwise.
- runFlow:
    when:
      visible: "Never"
    commands:
      - tapOn: "Never"

# Signing in and rendering the catalog is the slowest thing in this flow, and this job runs
# on a shared two-core runner. The default assertion window is tight enough there to fail
# intermittently on a login that is merely slow.
- assertVisible:
    text: "products screen"
    timeout: 30000
