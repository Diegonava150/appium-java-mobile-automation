# Critical-path smoke, in the fast lane.
#
# The division of labour with Appium is deliberate (ADR-008): Maestro answers "is the app
# fundamentally alive?" in seconds and gates the slower job. It absorbs timing flakiness
# automatically, which is exactly right for a smoke check and exactly wrong for a suite that
# needs to make precise claims about waits and state.
#
# Selectors use `text:`, not `id:`. Maestro's `id:` matches the Android resource-id, and this
# app does not populate it: of 112 nodes in a captured hierarchy, 3 had a resource-id and 40
# had a content-desc. React Native's testID becomes content-desc on Android, which Maestro
# reaches through its `text:` matcher (text or accessibility text).
#
# That is the same fact ADR-003 rests on, seen from Maestro's side: on Android, a React Native
# testID is an accessibility label, not an id. Android-only for that reason - the Appium suite
# carries the cross-platform parity claim, this lane just gates it.

appId: com.saucelabs.mydemoapp.rn
name: Critical path smoke
---
- launchApp:
    clearState: true

# The app opens on the catalog, not on login.
- assertVisible:
    text: "products screen"
- assertVisible:
    text: "store item"

# Open the first product and add it to the cart.
- tapOn:
    text: "store item"
    index: 0
- assertVisible:
    text: "product screen"
- tapOn:
    text: "Add To Cart button"

# Android renders the cart as a header badge.
- tapOn:
    text: "cart badge"
- assertVisible:
    text: "cart screen"
- assertVisible:
    text: "product row"
- assertVisible:
    text: "Proceed To Checkout button"
