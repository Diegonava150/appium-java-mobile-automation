name: Android

# The device-backed suite, on a real emulator, on a free runner.
#
# ubuntu-latest rather than macOS: GitHub's Linux runners expose KVM, which makes a
# hardware-accelerated x86_64 emulator roughly 2-3x faster than the same emulator on the
# macOS runners. The AVD snapshot cache is the other half of the story — without it this
# job spends most of its time waiting for a cold boot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34]

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Appium 3 and the UiAutomator2 driver
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version

      - name: Download the app under test
        run: ./gradlew downloadAndroidApp

      # Two-step AVD caching. On a cache miss the first step creates the AVD and saves a
      # boot snapshot; on a hit the emulator resumes from it. This is the difference
      # between a ~6 minute job and a ~20 minute one.
      - name: Cache the AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create the AVD and generate a snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."

      - name: Run the parity suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The Appium server has to be killed explicitly. A backgrounded process keeps the
          # runner's script step alive after the tests finish, so the job sits idle until the
          # job timeout cancels it — the suite goes green and the build still reports red.
          script: |
            adb devices
            appium --port 4723 --log-level info --log appium.log &
            appium_pid=$!
            npx wait-on -t 60000 http-get://127.0.0.1:4723/status
            set +e
            ./gradlew :tests:test -Dmobile.platform=android --stacktrace
            status=$?
            set -e
            kill "$appium_pid" 2>/dev/null || true
            exit $status

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-api${{ matrix.api-level }}
          # Screenshot, native view hierarchy and logcat for every failed test —
          # three independent views of the same moment.
          path: |
            tests/build/test-artifacts
            appium.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api${{ matrix.api-level }}
          path: tests/build/allure-results
          retention-days: 14
          if-no-files-found: ignore
