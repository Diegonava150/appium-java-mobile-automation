name: Quality gate

# Runs on every push and pull request. No emulator, no Appium, no API key, no secrets.
# Anyone who forks this repository gets a green build on their first push.
#
# It calls `qualityGate` rather than `check`, because `check` in :tests correctly
# includes the device-backed suites. Naming the tasks is what keeps "the gate is green"
# from quietly meaning "the gate skipped everything".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the toolchain the project targets. 25 runs too, so a future bump is a
        # known quantity rather than a surprise.
        java: [21, 25]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Quality gate
        run: ./gradlew qualityGate --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-java${{ matrix.java }}
          path: core/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  # ADR-009 claims the AI layer can be deleted and the framework still builds and runs.
  # That is the load-bearing claim of the whole design — it is what makes "optional" a
  # structural fact rather than a sentence in a README — and until this job existed it was
  # the one invariant in this repository with nothing enforcing it.
  #
  # -Pmobile.ai.absent=true drops the module from settings.gradle.kts exactly as deleting the
  # include() line would, then runs the entire gate. If anything in core, screens or tests
  # ever grows a dependency on the AI layer, this goes red and the ADR stops being a lie.
  without-ai:
    name: Deletable AI layer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Confirm the :ai module really is absent
        run: |
          ./gradlew projects -Pmobile.ai.absent=true -q | tee projects.txt
          if grep -q "Project ':ai'" projects.txt; then
            echo "::error::The :ai module is still in the build; this job would prove nothing."
            exit 1
          fi

      - name: Quality gate without the AI layer
        run: ./gradlew qualityGate -Pmobile.ai.absent=true --stacktrace

  # This repository handles an Anthropic API key. It is never committed and the AI layer is off
  # by default, but "we were careful" is the assurance every leaked-credential postmortem opens
  # with, and a repository nobody scanned looks exactly like one with nothing in it.
  #
  # Over the full history rather than the working tree. A key committed once and deleted in the
  # next commit is still in the pack file, still reachable by anyone who clones, and still has to
  # be rotated — removing the line does not unpublish it. A working-tree scan calls that
  # repository clean, which is the more dangerous of the two answers.
  #
  # Pinned, not :latest. Dependabot cannot see this tag, because it is a string inside a run step
  # rather than a `uses:` — so bumping it is a deliberate act. ADR-009's whole argument is that
  # convenience which hides a decision is the problem.
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

    steps:
      # v7 while the jobs above are still on v4: Dependabot was added in the same change and
      # will bring the rest forward on its next run. Writing a new job against v4 would have
      # meant knowingly adding another Node 20 deprecation warning to a build that already
      # prints one per step.
      - uses: actions/checkout@v7
        with:
          # Full history. The default shallow clone fetches one commit, and scanning one commit
          # while printing "no leaks found" is precisely the false assurance this job exists to
          # avoid.
          fetch-depth: 0

      # The same move as the "Deletable AI layer" job above, applied to a scanner: prove the
      # check can fail before believing that it passed. gitleaks pointed at a path that does not
      # exist exits 0, which is indistinguishable from a clean result — and that mount path is a
      # real thing that breaks.
      #
      # The key is generated here, random, valid nowhere, and written outside the workspace so
      # it can reach neither the scan below nor a commit.
      - name: Prove the scanner can fail
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          printf 'ANTHROPIC_API_KEY=sk-ant-api03-%sAA\n' \
            "$(head -c 300 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_-' | head -c 93)" \
            > "$canary/planted.env"

          if docker run --rm -v "$canary:/scan" "$GITLEAKS_IMAGE" \
               detect --source=/scan --no-git --redact --no-banner; then
            echo "::error::gitleaks reported clean on a directory containing a planted key."
            echo "::error::The scan below would report clean too, whatever this repository contains."
            exit 1
          fi
          echo "Planted key was caught, so a clean result below means something."

      - name: Scan the full history
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source=/repo --redact --verbose --no-banner
