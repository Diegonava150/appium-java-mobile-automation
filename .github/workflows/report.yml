name: Report

# Publishes the Allure report to GitHub Pages, carrying history forward between runs.
#
# History is the whole point. A single report tells you whether one run passed; a report with
# history tells you which tests have been unstable, whether cold start is drifting, and whether a
# quarantined test has quietly stopped needing its retries. Those are the questions worth asking,
# and none of them can be answered by a run in isolation.
#
# Runs after the Android workflow rather than inside it: there are two matrix legs producing
# results, and they have to be merged before a report means anything.
#
# Published through the official Pages actions, not by committing to a gh-pages branch. The two
# sibling repositories already work this way and this one was the odd one out — it carried a
# branch of generated HTML, and a third-party action to push to it. That action is the same class
# of dependency that broke the REST Assured repository's reporting when the base image of the
# Allure action it used was deleted from Docker Hub. Fewer things here can rot independently of
# the build.

on:
  workflow_run:
    workflows: ["Android", "iOS"]
    types: [completed]
  workflow_dispatch:

# contents: read, not write. Nothing is committed any more; deployment goes through the Pages
# service, which is what pages/id-token authorise.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # Results from *both* platform lanes, not just whichever run triggered this.
      #
      # This downloaded from github.event.workflow_run.id and triggered on Android alone, so the
      # published report was Android-only: 27 tests, no iOS. The iOS lane uploaded
      # allure-results-ios to its own run and nothing ever read it.
      #
      # Which is the wrong report for this repository in particular. The framework's whole claim
      # is that one suite runs on Android and iOS with no platform branching, and the public
      # artifact offered as evidence showed one platform. The README was at least honest about it
      # — "published from every Android run" — but an honest description of the wrong thing is
      # still the wrong thing.
      #
      # So: ignore which workflow woke this up, and take the newest completed run of each lane.
      # Whichever finishes second publishes a report containing both.
      #
      # Deliberately `completed` rather than `success`. A failing iOS run's results are exactly
      # the ones worth reading, and filtering to green is how a report starts flattering the
      # suite it is supposed to describe.
      - name: Collect Allure results from both platform lanes
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded

          # Every lane runs the same suite, so the same test name arrives three times — api31,
          # api34, ios — carrying the same historyId. Allure keys on historyId, so merging them
          # untouched makes it treat three independent runs as retries of one test and show a
          # single status. Measured on real artifacts: 27 of the ids collided, and the iOS lane
          # was contributing two *broken* results against 27 passing Android ones. Those two
          # would have disappeared behind a green tick.
          #
          # So each result is stamped with its lane before merging: the historyId is suffixed so
          # the lanes stay distinct and each keeps its own trend line, and a `lane` parameter is
          # added so the report shows which is which.
          cat > tag.py <<'PY'
          import json, pathlib, shutil, sys
          src, dest, lane = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
          n = 0
          for f in src.iterdir():
              if not f.is_file():
                  continue
              out = dest / f.name
              if f.name.endswith('-result.json'):
                  d = json.loads(f.read_text(encoding='utf-8'))
                  d['historyId'] = (d.get('historyId') or '') + '::' + lane
                  d['parameters'] = (d.get('parameters') or []) + [{'name': 'lane', 'value': lane}]
                  out.write_text(json.dumps(d), encoding='utf-8')
                  n += 1
              elif not out.exists():
                  shutil.copy2(f, out)
          print(f'  lane={lane}: {n} result(s)')
          PY

          for wf in android.yml ios.yml; do
            rid=$(gh run list --workflow="$wf" --branch main --status completed --limit 1 \
                    --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$rid" ]; then
              echo "$wf: no completed run yet"
              continue
            fi

            tmp=$(mktemp -d)
            if gh run download "$rid" -D "$tmp" --pattern 'allure-results-*' 2>/dev/null; then
              concl=$(gh run view "$rid" --json conclusion --jq .conclusion)
              echo "$wf: run $rid ($concl)"
              # One directory per artifact, so the lane name is the artifact suffix.
              for dir in "$tmp"/allure-results-*; do
                [ -d "$dir" ] || continue
                lane=$(basename "$dir"); lane=${lane#allure-results-}
                python3 tag.py "$dir" downloaded "$lane"
                echo "$lane" >> lanes.txt
              done
            else
              echo "$wf: run $rid has no allure-results-* artifact"
            fi
            rm -rf "$tmp"
          done

          total=$(find downloaded -name '*-result.json' | wc -l | tr -d ' ')
          echo "total result files: $total"

          # A historyId collision surviving this point means the lanes would silently fold
          # together again, which is the whole failure being fixed. Cheap to assert.
          python3 - <<'PY'
          import json, glob, collections
          ids = collections.Counter()
          for f in glob.glob('downloaded/*-result.json'):
              ids[json.load(open(f, encoding='utf-8')).get('historyId')] += 1
          dupes = {k: v for k, v in ids.items() if v > 1}
          print(f'{sum(ids.values())} results, {len(ids)} distinct historyIds')
          if dupes:
              raise SystemExit(
                  f'::error::{len(dupes)} historyId collision(s) after lane tagging; '
                  'Allure would merge those results and hide one lane behind another.')
          PY

          # Which lanes are represented is itself worth saying. The failure being fixed here was
          # silent: the report looked complete and simply had no iOS in it.
          if ! grep -qx 'ios' lanes.txt 2>/dev/null; then
            echo "::warning title=iOS missing from report::No iOS results were available, so this report covers Android only."
          fi
          if ! grep -q '^api' lanes.txt 2>/dev/null; then
            echo "::warning title=Android missing from report::No Android results were available."
          fi

      - name: Stop early if the run produced no results
        id: check
        run: |
          if [ -d downloaded ] && [ -n "$(ls -A downloaded 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Allure results in this run — nothing to publish."
          fi

      # The previous report's history is what turns a series of isolated reports into a trend.
      # Without it every report claims to be the first one ever run.
      #
      # Read over HTTP from the published site, which is a direct translation of what the old
      # gh-pages checkout did: the last published report *is* the previous state. Deliberately not
      # actions/cache — GitHub evicts a cache after seven days without a read, so on a repository
      # that goes quiet for a week the trend would reset itself and nothing would say so. The
      # published report cannot expire out from under us.
      - name: Restore history from the published report
        if: steps.check.outputs.found == 'true'
        run: |
          site="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p downloaded/history
          restored=0
          for file in history.json history-trend.json categories-trend.json \
                      duration-trend.json retry-trend.json; do
            if curl -fsSL --max-time 30 -o "downloaded/history/$file" "$site/history/$file"; then
              restored=$((restored + 1))
            else
              rm -f "downloaded/history/$file"
            fi
          done
          if [ "$restored" -eq 0 ]; then
            echo "No previous history at $site — this will be the first report in the series."
          else
            echo "Carried forward $restored history file(s) from $site."
          fi

      - name: Set up JDK 21
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # executor.json goes into the *results* directory, before generation.
      #
      # It used to be written into allure-report/ afterwards, which did nothing at all: Allure
      # reads executor.json while generating and renders it into widgets/executors.json. That
      # widget has been an empty array on every published report since the step was added — the
      # run has never actually been named, and the report looked like it was.
      - name: Name the run in the report
        if: steps.check.outputs.found == 'true'
        run: |
          # No longer "Android #N" — this report is assembled from both lanes, so naming it
          # after one of them was going to be wrong half the time.
          cat > downloaded/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ github.event.workflow_run.name || 'Report' }} #${{ github.event.workflow_run.run_number || github.run_number }}",
            "buildUrl": "${{ github.event.workflow_run.html_url || github.server_url }}",
            "reportUrl": "${{ github.server_url }}/${{ github.repository }}"
          }
          JSON

          # An environment panel, which this report has never had. The one fact a reader most
          # needs from it is which platforms are actually in front of them.
          {
            echo "Framework=Appium 3 / Java 21 / JUnit 6"
            # paste -d takes a *list* of delimiters used cyclically, so -d', ' joined the
            # first pair with a comma and the second with a space: "api31,api34 ios".
            echo "Lanes.in.this.report=$( [ -f lanes.txt ] && sort -u lanes.txt | paste -sd, - | sed 's/,/, /g' || echo none )"
            echo "Lane.parameter=Every result carries a 'lane' parameter naming the device it ran on"
          } > downloaded/environment.properties
          cat downloaded/environment.properties

      - name: Generate the report
        if: steps.check.outputs.found == 'true'
        run: |
          npm install -g allure-commandline
          allure generate downloaded --clean -o allure-report

          # Prove the executor was actually picked up. The previous version of this step looked
          # exactly like it worked and produced an empty widget for twenty consecutive reports,
          # because nothing ever read the file back. Checking is three lines.
          widget=allure-report/widgets/executors.json
          if [ ! -s "$widget" ] || ! grep -q 'buildName' "$widget"; then
            echo "::error::$widget has no executor — executor.json was not picked up and the run is unnamed."
            cat "$widget" 2>/dev/null || echo "(the widget was not written at all)"
            exit 1
          fi
          echo "Executor recorded: $(cat "$widget")"

      - uses: actions/configure-pages@v6
        if: steps.check.outputs.found == 'true'

      - name: Upload the report
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to Pages
        id: deploy
        if: steps.check.outputs.found == 'true'
        uses: actions/deploy-pages@v5
