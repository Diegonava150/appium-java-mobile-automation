name: iOS

# The parity claim only means something if both halves actually run. This is the other half.
#
# NOTE: this workflow has not been executed — the framework was developed on Windows, so the
# iOS suite has only ever been compiled, never run. The simulator lane is expected to need
# adjustment on its first real run. See "Known limitations" in the README.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Appium 3 and the XCUITest driver
        run: |
          npm install -g appium@3
          appium driver install xcuitest
          appium --version

      - name: Fetch and unpack the simulator build
        run: ./gradlew unpackIosApp

      - name: Boot a simulator
        id: sim
        run: |
          xcrun simctl list devicetypes
          UDID=$(xcrun simctl create parity-runner "iPhone 16" || xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for v in d.values() for x in v if x['isAvailable']][0])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Start Appium
        run: |
          appium --port 4723 --log-level info --log appium.log &
          npx wait-on -t 60000 http-get://127.0.0.1:4723/status

      - name: Run the parity suite
        run: |
          ./gradlew :tests:test \
            -Dmobile.platform=ios \
            -Dmobile.ios.devices=${{ steps.sim.outputs.udid }} \
            --stacktrace

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-failure-artifacts
          path: |
            tests/build/test-artifacts
            appium.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: tests/build/allure-results
          retention-days: 14
          if-no-files-found: ignore
