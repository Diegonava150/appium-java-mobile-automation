name: iOS

# The parity claim only means something if both halves actually run. This is the other half.
#
# It does run, and it took six rounds to get there — every diagnosis made from the failure
# artifacts this job uploads, on a Windows machine with no Mac attached. The three that mattered:
# XCUITest computes visibility from an element's own frame, so React Native's zero-size container
# wrappers report invisible while their children are plainly on screen; iOS offers to save the
# password after a sign-in, and that system dialog floats above the catalog and makes every row
# untappable; and the numeric keypad has no dismiss key, so the only thing that closes it is a tap
# outside.
#
# The remaining known fragility is the simulator itself. A run failed with
# "the simulator has failed to finish booting after 128s" partway through the suite, after 27 of
# 28 tests had passed — Appium's 120 s default is too tight for a shared runner. See
# mobile.ios.simulatorStartupTimeout.seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Appium 3 and the XCUITest driver
        run: |
          npm install -g appium@3
          appium driver install xcuitest
          appium --version

      - name: Fetch and unpack the simulator build
        run: ./gradlew unpackIosApp

      # WebDriverAgent is an Xcode project, and without a shared derived-data directory it is
      # rebuilt for every single session. Caching it is the main lever on this job's runtime.
      - name: Cache WebDriverAgent derived data
        uses: actions/cache@v6
        with:
          path: ~/wda-derived-data
          key: wda-derived-data-${{ runner.os }}-v1

      - name: Boot a simulator
        id: sim
        run: |
          xcrun simctl list devicetypes
          UDID=$(xcrun simctl create parity-runner "iPhone 16" || xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for v in d.values() for x in v if x['isAvailable']][0])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Start Appium
        run: |
          appium --port 4723 --log-level info --log appium.log &
          npx wait-on -t 60000 http-get://127.0.0.1:4723/status

      - name: Run the parity suite
        run: |
          ./gradlew :tests:test \
            -Dmobile.platform=ios \
            -Dmobile.ios.devices=${{ steps.sim.outputs.udid }} \
            -Dmobile.ios.derivedDataPath="$HOME/wda-derived-data" \
            --stacktrace --no-daemon

      - name: Upload failure artifacts
        # See the note in android.yml: a job cancelled by its timeout is not failure(), and
        # skipping the upload there discards the evidence for the runs hardest to diagnose.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-failure-artifacts
          path: |
            tests/build/test-artifacts
            appium.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ios
          path: tests/build/allure-results
          retention-days: 14
          if-no-files-found: ignore
