name: iOS

# The parity claim only means something if both halves actually run. This is the other half.
#
# It does run, and it took six rounds to get there — every diagnosis made from the failure
# artifacts this job uploads, on a Windows machine with no Mac attached. The three that mattered:
# XCUITest computes visibility from an element's own frame, so React Native's zero-size container
# wrappers report invisible while their children are plainly on screen; iOS offers to save the
# password after a sign-in, and that system dialog floats above the catalog and makes every row
# untappable; and the numeric keypad has no dismiss key, so the only thing that closes it is a tap
# outside.
#
# The remaining known fragility is the simulator itself. A run failed with
# "the simulator has failed to finish booting after 128s" partway through the suite, after 27 of
# 28 tests had passed — Appium's 120 s default is too tight for a shared runner. See
# mobile.ios.simulatorStartupTimeout.seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Pinned to v5 deliberately; do not take the v6 bump without re-checking this.
      #
      # v5 answers `java-version: 21` from the runner's tool cache:
      #     Resolved Java 21.0.11+10.0 from tool-cache
      # v6 ignores it and goes to the network on every job, even with check-latest false:
      #     Trying to resolve the latest version from remote
      #     Downloading Java 21.0.12+101.0.LTS from https://github.com/adoptium/...
      #
      # That turned a zero-network cache hit into a CDN dependency in every lane. It was merged
      # here as PR #33, and cost main's iOS lane the same day when the download returned 504 three
      # times and the job died before a single test ran. Cheap on a good day, and a whole lane on
      # a bad one, for nothing this repository wanted.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Appium 3 and the XCUITest driver
        run: |
          npm install -g appium@3
          appium driver install xcuitest
          appium --version

      - name: Fetch and unpack the simulator build
        run: ./gradlew unpackIosApp

      # WebDriverAgent is an Xcode project, and without a shared derived-data directory it is
      # rebuilt for every single session. Caching it is the main lever on this job's runtime.
      - name: Cache WebDriverAgent derived data
        uses: actions/cache@v6
        with:
          path: ~/wda-derived-data
          key: wda-derived-data-${{ runner.os }}-v1

      - name: Boot a simulator
        id: sim
        run: |
          xcrun simctl list devicetypes
          UDID=$(xcrun simctl create parity-runner "iPhone 16" || xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for v in d.values() for x in v if x['isAvailable']][0])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # The first Appium session on a cold machine took 432 s, against what was then a 420 s
      # client timeout — the lane's intermittent SessionNotCreatedException. The timeout is now
      # 600 s, so it no longer fails, but the cost was still hidden: it landed inside whichever
      # test happened to run first, which reported 451 s and looked like the slowest test in the
      # suite. It is not; it is the only one that pays for the machine.
      #
      # Two of the three big pieces can be done here, with tooling the job already uses:
      #
      #   Simulator UI launch  ~39 s   Appium runs `open -Fn .../Simulator.app` itself. `simctl
      #                                boot` above starts the runtime but not the UI.
      #   Installing the app   ~70 s   "App 'com.saucelabs.mydemoapp.rn' is not installed yet"
      #
      # Deliberately simctl rather than a throwaway Appium session. A session needs capabilities,
      # and writing those into YAML would duplicate CapabilityFactory — two copies of one thing,
      # which is the drift this repository has already been bitten by twice.
      #
      # The third piece, building and launching WebDriverAgent, still happens in the first
      # session. It needs a session to happen inside.
      - name: Warm up the simulator
        run: |
          open -a Simulator --args -CurrentDeviceUDID "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

          app="$(pwd)/build/apps/ios/MyRNDemoApp.app"
          if [ ! -d "$app" ]; then
            echo "::error::No .app at $app — unpackIosApp did not produce what this step expects."
            exit 1
          fi
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"

          # Prove it, rather than assuming: an install that silently no-ops would move the 70 s
          # straight back into the first test and nothing here would say so.
          if ! xcrun simctl listapps "${{ steps.sim.outputs.udid }}" | grep -q 'com.saucelabs.mydemoapp.rn'; then
            echo "::error::The app is not installed after simctl install; the warm-up did nothing."
            exit 1
          fi
          echo "Simulator UI is up and com.saucelabs.mydemoapp.rn is installed."

      - name: Start Appium
        run: |
          appium --port 4723 --log-level info --log appium.log &
          npx wait-on -t 60000 http-get://127.0.0.1:4723/status

      - name: Run the parity suite
        run: |
          ./gradlew :tests:test \
            -Dmobile.platform=ios \
            -Dmobile.ios.devices=${{ steps.sim.outputs.udid }} \
            -Dmobile.ios.derivedDataPath="$HOME/wda-derived-data" \
            --stacktrace --no-daemon

      - name: Upload failure artifacts
        # See the note in android.yml: a job cancelled by its timeout is not failure(), and
        # skipping the upload there discards the evidence for the runs hardest to diagnose.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-failure-artifacts
          path: tests/build/test-artifacts
          retention-days: 14
          if-no-files-found: ignore

      # Always, not just on failure. This log is the only place the per-session cost is
      # recorded — `POST /session 200 432597 ms` is what identified the cold start, and it was
      # only available because that particular run happened to fail. Every green run's timing
      # was being thrown away, which is precisely the data needed to tell a real improvement
      # from a fast runner.
      - name: Upload the Appium log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-appium-log
          path: appium.log
          retention-days: 14
          if-no-files-found: ignore

      # The session timings, extracted into the job summary so the next person does not have to
      # download an artifact to see where the time went.
      #
      # Read them as one sample, not as a measurement. Three runs on this runner have produced:
      #
      #     cold start        432 s          273 s          494 s
      #     steady session     40 s           59 s
      #     session setup            58-63% of the lane
      #
      # The first of those predates the warm-up step above; the other two follow it. Which is
      # exactly the trap — 432 to 273 looks like the step working, until the next run comes back
      # at 494 and the "improvement" turns out to be two samples either side of a spread wider
      # than the thing being measured. That conclusion was drawn here and is withdrawn; so was a
      # "30% faster" claim before it, for the same reason.
      #
      # What a single run does support is structure. The session count, and the share of the lane
      # those sessions account for, are properties of the suite rather than of the morning — and
      # 14 sessions eating 58-63% of the run is the finding worth acting on. The lever there is
      # creating fewer sessions, not making each one faster.
      #
      # The warm-up step is justified on the same footing: it names the cold start and moves it
      # out of whichever test ran first. Its commit message claims no wall-clock effect. Keep it
      # that way.
      - name: Session timings
        if: always()
        run: |
          if [ ! -f appium.log ]; then echo "No appium.log." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "### Session creation"
            echo ""
            grep -oE '<-- POST /session 200 [0-9]+ ms' appium.log \
              | grep -oE '[0-9]+ ms' | awk '{ s+=$1; n+=1; if (n==1) first=$1 }
                  END { if (n==0) { print "No sessions recorded." ; exit }
                        printf "- sessions: **%d**\n", n
                        printf "- first (cold start): **%.1f s**\n", first/1000
                        if (n>1) printf "- the rest: **%.1f s** total, %.1f s each\n", (s-first)/1000, (s-first)/(n-1)/1000
                        printf "- all session setup: **%.1f min**\n", s/60000 }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ios
          path: tests/build/allure-results
          retention-days: 14
          if-no-files-found: ignore
