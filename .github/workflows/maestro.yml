name: Maestro smoke

# The fast gate. If the app does not launch or a user cannot sign in, there is no point
# spending twenty minutes on the Appium matrix. See ADR-008 for the tool split.
#
# NOTE: these flows have not yet been executed anywhere — Maestro has no Windows build and the
# framework was developed on Windows. This job is their first real run. See maestro/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Android smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pinned to v5 deliberately; do not take the v6 bump without re-checking this.
      #
      # v5 answers `java-version: 21` from the runner's tool cache:
      #     Resolved Java 21.0.11+10.0 from tool-cache
      # v6 ignores it and goes to the network on every job, even with check-latest false:
      #     Trying to resolve the latest version from remote
      #     Downloading Java 21.0.12+101.0.LTS from https://github.com/adoptium/...
      #
      # That turned a zero-network cache hit into a CDN dependency in every lane. It was merged
      # here as PR #33, and cost main's iOS lane the same day when the download returned 504 three
      # times and the job died before a single test ran. Cheap on a good day, and a whole lane on
      # a bad one, for nothing this repository wanted.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download the app under test
        run: ./gradlew downloadAndroidApp

      # `curl | bash` reports the exit code of bash, and this installer exits 0 even when its
      # download fails. On 2026-08-31 the vendor CDN returned a 504, the installer printed
      # "Downloaded zip archive is corrupt", the step went green, and the job then spent three
      # minutes booting an emulator and installing an APK before dying on `maestro: not found`
      # with exit 127 — a fifteen-second failure reported four minutes late, in the wrong place,
      # as something else.
      #
      # So the install is retried, and then checked. `maestro --version` is the assertion: it is
      # the difference between "the installer ran" and "maestro is on PATH and works", which is
      # the only property the next step actually needs.
      - name: Install Maestro
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 "https://get.maestro.mobile.dev" | bash; then
              if "$HOME/.maestro/bin/maestro" --version >/dev/null 2>&1; then
                echo "Maestro installed on attempt $attempt."
                echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
                exit 0
              fi
              echo "::warning::Attempt $attempt: the installer exited 0 but maestro does not run."
            else
              echo "::warning::Attempt $attempt: the installer download failed."
            fi
            sleep $((attempt * 10))
          done

          echo "::error::Maestro could not be installed after 3 attempts."
          echo "The installer exits 0 on a failed download, so this step checks 'maestro --version'"
          echo "rather than trusting it. Failing here, rather than 3 minutes later as 'command not found'."
          exit 1

      - name: Run the smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r build/apps/MyDemoApp-1.3.0.apk
            maestro test maestro/ --format junit --output maestro-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: |
            maestro-results.xml
            ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore
